<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hablar con Mariana · Una Mamá Más</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FDF6E9;font-family:Poppins,system-ui,sans-serif;color:#5b5257;text-align:center;padding:24px;box-sizing:border-box}
  a{display:inline-block;margin-top:18px;padding:14px 26px;border-radius:999px;background:#A5544D;color:#fff;text-decoration:none;font-weight:600}
  a:hover{background:#8f463f}
  h1{color:#7A4A5F;font-size:22px;margin:0 0 6px}
</style>
</head>
<body>
<div>
  <h1>Te llevo al chat de Mariana</h1>
  <p style="margin:0">Si no se abre solo, toca el botón.</p>
  <a id="ir" href="https://wa.me/573165055231">Abrir WhatsApp</a>
</div>
<script>
  // Meta no deja poner wa.me en los botones de plantilla; el botón trae aquí y esta página abre el chat.
  var T={
    reactivar:'Hola Mariana, recibí tu mensaje y quiero contarte cómo van las noches',
    regresion_4m:'Hola Mariana, vi tu mensaje sobre la regresión de los 4 meses',
    curso_a_plan:'Hola Mariana, hice el curso y quiero saber del plan personalizado',
    nuevo_curso:'Hola Mariana, quiero saber del nuevo curso',
    vacaciones:'Hola Mariana, quiero las recomendaciones para las vacaciones',
    seguimiento:'Hola Mariana, me interesa la semana de seguimiento',
    precio_especial:'Hola Mariana, quiero saber del precio especial',
    referidos:'Hola Mariana, quiero recomendarte a otra mamá'
  };
  var c=new URLSearchParams(location.search).get('c')||'';
  var url='https://wa.me/573165055231?text='+encodeURIComponent(T[c]||'Hola Mariana, recibí tu mensaje de Una Mamá Más');
  document.getElementById('ir').href=url;
  location.replace(url);
</script>
</body>
</html>

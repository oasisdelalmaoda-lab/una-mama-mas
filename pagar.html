<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagar · Una Mamá Más</title>
<link rel="icon" href="assets/favicon.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FDF6E9;font-family:Poppins,system-ui,sans-serif;color:#4a4246;padding:24px 16px}
  main{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:28px 22px;box-shadow:0 8px 30px rgba(122,74,95,.12)}
  img.logo{display:block;height:44px;margin:0 auto 18px}
  h1{color:#7A4A5F;font-size:21px;line-height:1.3;margin:0 0 4px;text-align:center}
  .precio{font-size:26px;font-weight:700;color:#4a4246;text-align:center;margin:6px 0 2px}
  .vence{font-size:13px;color:#6b6166;text-align:center;margin:0 0 22px}
  label{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px;color:#4a4246}
  input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid #d9cfd3;border-radius:12px;margin:0 0 14px;color:#4a4246;background:#fff}
  input:focus{outline:none;border-color:#A5544D;box-shadow:0 0 0 3px rgba(165,84,77,.18)}
  .opc{font-weight:400;color:#6b6166}
  button{width:100%;font:inherit;font-size:16px;font-weight:600;padding:14px;border:0;border-radius:999px;background:#A5544D;color:#fff;cursor:pointer;margin-top:4px}
  button:hover{background:#8f463f}
  button:disabled{background:#b98a85;cursor:default}
  .err{color:#a3271f;font-size:14px;font-weight:600;margin:4px 0 10px;min-height:1px}
  .nota{font-size:12.5px;color:#6b6166;text-align:center;margin:14px 0 0}
  .cerrado{text-align:center}
  .cerrado p{margin:8px 0 0}
  a{color:#A5544D}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo-una-mama-mas.png" alt="Una Mamá Más">
  <div id="cargando" class="cerrado"><p>Cargando…</p></div>

  <div id="cerrado" class="cerrado" hidden>
    <h1 id="motivo">Este enlace de pago está cerrado.</h1>
    <p>Si quieres este producto, escríbenos.</p>
    <p><a href="https://wa.me/573165055231?text=Hola%20Mariana%2C%20quiero%20informaci%C3%B3n%20de%20un%20producto">Hablar por WhatsApp</a></p>
  </div>

  <form id="form" hidden novalidate>
    <h1 id="producto"></h1>
    <div class="precio" id="precio"></div>
    <p class="vence" id="vence"></p>
    <label for="nombre">Nombre completo</label>
    <input id="nombre" name="nombre" autocomplete="name" required>
    <label for="celular">WhatsApp</label>
    <input id="celular" name="celular" type="tel" inputmode="tel" autocomplete="tel" placeholder="300 000 0000" required>
    <label for="correo">Correo <span class="opc">(opcional)</span></label>
    <input id="correo" name="correo" type="email" inputmode="email" autocomplete="email">
    <div class="err" id="err" role="alert"></div>
    <button type="submit" id="btn">Ir a pagar</button>
    <p class="nota">Pagas en Bold con tarjeta o PSE. Si no eres de Colombia, escribe tu número con + y el indicativo.</p>
  </form>
</main>
<script>
  var API = 'https://fswehdxgzbksmajmqtrm.supabase.co/functions/v1/link-producto';
  var slug = (new URLSearchParams(location.search).get('p') || '').trim().toLowerCase();
  var $ = function (id) { return document.getElementById(id); };
  function cerrar(msg) { $('cargando').hidden = true; $('form').hidden = true; $('motivo').textContent = msg || 'Este enlace de pago está cerrado.'; $('cerrado').hidden = false; }
  function fechaHora(iso) {
    try { return new Date(iso).toLocaleString('es-CO', { timeZone: 'America/Bogota', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }); }
    catch (e) { return ''; }
  }
  if (!slug) cerrar('Este enlace no existe.');
  else fetch(API + '?p=' + encodeURIComponent(slug)).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.abierto) return cerrar(d && (d.motivo || d.error));
    $('producto').textContent = d.producto;
    $('precio').textContent = '$' + Math.round(d.valor).toLocaleString('es-CO') + ' COP';
    $('vence').textContent = d.hasta ? 'Disponible hasta el ' + fechaHora(d.hasta) : '';
    document.title = d.producto + ' · Una Mamá Más';
    $('cargando').hidden = true; $('form').hidden = false; $('nombre').focus();
  }).catch(function () { cerrar('No pudimos cargar el enlace. Revisa tu conexión e inténtalo de nuevo.'); });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var nombre = $('nombre').value.trim(), celular = $('celular').value.trim(), correo = $('correo').value.trim();
    if (nombre.length < 3) { $('err').textContent = 'Escribe tu nombre completo.'; return $('nombre').focus(); }
    if (celular.replace(/\D/g, '').length < 10) { $('err').textContent = 'Revisa el número de WhatsApp.'; return $('celular').focus(); }
    $('err').textContent = ''; $('btn').disabled = true; $('btn').textContent = 'Preparando el pago…';
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ p: slug, nombre: nombre, celular: celular, correo: correo }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.url) { location.href = d.url; return; }
        $('err').textContent = (d && d.error) || 'No se pudo crear el pago. Inténtalo de nuevo.';
        $('btn').disabled = false; $('btn').textContent = 'Ir a pagar';
      })
      .catch(function () { $('err').textContent = 'Sin conexión. Inténtalo de nuevo.'; $('btn').disabled = false; $('btn').textContent = 'Ir a pagar'; });
  });
</script>
</body>
</html>
